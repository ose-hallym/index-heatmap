<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>히트맵 시세 원본</title>
</head>
<body>
<!-- Claude 페이지가 앱 브라우저로 읽어 가는 시세 원본. 1분마다 data.json 을 다시 읽어 글자로 펼쳐 둔다. -->
<main><pre id="feed">불러오는 중</pre></main>
<script>
(function () {
  function load() {
    fetch('data.json?t=' + Math.floor(Date.now() / 30000), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) {
        JSON.parse(t);
        document.getElementById('feed').textContent = '@@HM' + Math.floor(Date.now() / 1000) + '@@' + t + '@@END@@';
      })
      .catch(function () {});
  }
  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
