<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>한미 4대 지수 히트맵</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 조작 줄, 요약 줄, 일정 줄만 얇게 두고 남은 높이는 전부 트리맵이 쓴다.
   색: 국내 지수는 한국 관례(상승 빨강, 하락 파랑), 미국 지수는 미국 관례(상승 초록, 하락 빨강). 중립점은 회색.
   색은 트리맵에만 쓰고, 둘레의 조작부는 종이색과 잉크색만 쓴다.
   간격은 4px 단위, 글자 크기는 12·13·14·16·24 다섯 가지만 쓴다(타일 글자는 타일 크기에 맞춰 계산). */
:root{
  --bg:#f1f0eb; --surface:#fcfcfb; --raise:#fcfcfb; --hover:#f5f4ef; --fg:#14140f; --fg2:#52514e; --muted:#6b6962; --line:#dbdad2;
  --chip:#e6e5de; --sel-bg:#14140f; --sel-fg:#fcfcfb;
  --up:#d03b3b; --down:#256abf; --mid:#e0dfd8; --tile-ink:#14140f;
  --us-up:#15803d; --us-down:#d03b3b;
  --live:#0c8a0c; --warn:#b45309;
  --lift:0 1px 2px rgba(20,20,15,.10); --shadow:0 8px 24px rgba(20,20,15,.10);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d0d; --surface:#1a1a19; --raise:#3a3a37; --hover:#222220; --fg:#f0efec; --fg2:#c3c2b7; --muted:#918f88; --line:#2f2f2c;
    --chip:#262624; --sel-bg:#f0efec; --sel-fg:#14140f;
    --up:#d03b3b; --down:#256abf; --mid:#3a3a37; --tile-ink:#14140f;
    --live:#2fbf2f; --warn:#f0a531;
    --lift:inset 0 1px 0 rgba(255,255,255,.08); --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --raise:#3a3a37; --hover:#222220; --fg:#f0efec; --fg2:#c3c2b7; --muted:#918f88; --line:#2f2f2c;
  --chip:#262624; --sel-bg:#f0efec; --sel-fg:#14140f;
  --up:#d03b3b; --down:#256abf; --mid:#3a3a37; --tile-ink:#14140f;
  --live:#2fbf2f; --warn:#f0a531;
  --lift:inset 0 1px 0 rgba(255,255,255,.08); --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
.hm-app[data-scheme="us"]{--up:var(--us-up);--down:var(--us-down)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.hm-app{box-sizing:border-box;height:100%;min-height:460px;display:flex;flex-direction:column;gap:12px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 버튼 기본값 지우기. :where 로 우선순위를 낮춰 아래의 버튼별 규칙이 이긴다 */
:where(.hm-app) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  transition:background-color .14s var(--ease),color .14s var(--ease),box-shadow .14s var(--ease)}
.hm-app button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* 조작 줄: 모든 조작부의 높이는 32 */
.hm-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 16px}
.hm-bar h1{margin:0;font-size:16px;font-weight:600;text-wrap:balance}
.hm-nav{display:flex;align-items:center;gap:4px;min-width:0}
.hm-step{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--fg2);flex:none}
.hm-step:hover{background:var(--chip);color:var(--fg)}
/* 지수 고르기와 보기 방식은 같은 모양의 고르개: 회색 홈 안에서 고른 칸만 올라온다 */
.hm-tabs,.hm-seg{display:flex;gap:2px;padding:4px;border-radius:8px;background:var(--chip);min-width:0}
.hm-tabs button,.hm-seg button{height:24px;padding:0 12px;border-radius:4px;font-size:13px;font-weight:500;color:var(--fg2);white-space:nowrap}
.hm-seg button{padding:0 8px}
.hm-tabs button:hover,.hm-seg button:hover{color:var(--fg)}
.hm-tabs button[aria-selected="true"],.hm-seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:var(--lift)}
.hm-tools{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.hm-tool{height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--fg2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.hm-tool:hover{color:var(--fg);background:var(--hover)}
.hm-tool[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);box-shadow:none}

/* 갱신 상태 안내(Claude 페이지에서만 보인다) */
.hm-note{margin:0;padding:8px 12px;border-radius:8px;background:var(--chip);font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.hm-note a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.hm-note .hm-tool{height:24px;padding:0 8px;margin:0 4px;border-radius:6px;color:var(--fg);background:var(--raise)}

/* 요약 줄 */
.hm-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;min-height:32px}
.hm-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;min-width:0}
.hm-q{display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hm-qn{font-size:12px;color:var(--fg2)}
.hm-qv{font-size:14px;font-weight:500}
.hm-qd{font-size:13px}
.hm-qt{font-size:12px;color:var(--muted)}
.hm-q.big .hm-qn{font-size:13px}
.hm-q.big .hm-qv{font-size:24px;font-weight:600;line-height:32px}
.hm-q.big .hm-qd{font-size:16px;font-weight:500}
.hm-qsep{align-self:stretch;width:1px;background:var(--line)}
.hm-arw{font-size:11px;margin-right:4px;position:relative;top:-1px}
/* 구성종목 이야기(오른 수와 내린 수, 기준 시각)는 한 묶음: 자리가 모자라면 둘이 함께 다음 줄로 내려간다 */
.hm-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}
.hm-breadth{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2);white-space:nowrap;font-variant-numeric:tabular-nums}
.hm-bbar{display:flex;gap:2px;width:112px;height:8px}
.hm-bbar i{display:block;border-radius:2px;min-width:2px}
.hm-asof{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.hm-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.hm-dot.live{background:var(--live)}
.hm-dot.late{background:var(--warn)}
.hm-warn{color:var(--warn);font-weight:500}
.hm-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.hm-legend .sw{display:flex;gap:2px}
.hm-legend .sw i{display:block;width:20px;height:8px;border-radius:2px}

/* 일정 줄 */
.hm-events{display:flex;align-items:center;gap:12px;min-width:0;font-size:13px}
.hm-evt-title{flex:none;font-size:12px;color:var(--muted)}
.hm-evt-list{display:flex;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none}
.hm-evt-list::-webkit-scrollbar{display:none}
.hm-ev{flex:none;display:inline-flex;align-items:baseline;gap:8px;padding:4px 8px;border-radius:6px;background:var(--chip);white-space:nowrap}
.hm-ev b{font-weight:500;font-variant-numeric:tabular-nums}
.hm-ev time{color:var(--fg2);font-variant-numeric:tabular-nums}
.hm-ev.soon{background:var(--sel-bg);color:var(--sel-fg)}
.hm-ev.soon time{color:inherit;opacity:.8}

/* 본문 */
.hm-stage{position:relative;flex:1 1 auto;min-height:260px;background:var(--surface);border-radius:12px;overflow:hidden}
.hm-map{position:absolute;inset:8px;touch-action:pan-y}
.hm-t{position:absolute;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:2px;line-height:1.15;white-space:nowrap;cursor:default;user-select:none;-webkit-user-select:none}
.hm-t b{font-weight:600}
.hm-t span{font-variant-numeric:tabular-nums;opacity:.92}
.hm-t.on{outline:2px solid var(--fg);outline-offset:-2px;z-index:2}
.hm-sec{position:absolute;height:20px;line-height:20px;font-size:12px;font-weight:500;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hm-sec span{font-weight:400;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.hm-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--fg2);background:var(--surface)}

.hm-tablewrap{position:absolute;inset:0;overflow:auto}
.hm-table{width:100%;border-collapse:collapse;font-size:13px;line-height:20px}
.hm-table th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;font-weight:500;color:var(--fg2);font-size:12px;padding:0;box-shadow:inset 0 -1px 0 var(--line)}
.hm-table th button{display:block;width:100%;padding:8px 12px;text-align:inherit;white-space:nowrap}
.hm-table th button:hover,.hm-table th[aria-sort] button{color:var(--fg)}
.hm-table th.num,.hm-table td.num{text-align:right}
.hm-table td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.hm-table tbody tr:hover td{background:var(--hover)}
.hm-table td.num{font-variant-numeric:tabular-nums}
.hm-table td small{color:var(--muted);margin-left:8px;font-size:12px}
.hm-table .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}

/* 아래 줄: 색 눈금과 읽는 법을 지도 바로 밑에 함께 둔다(넓은 화면에서는 설명 왼쪽, 눈금 오른쪽) */
.hm-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:12px;line-height:16px;color:var(--muted)}
.hm-foot > span{flex:1 1 320px;min-width:0}

/* 떠 있는 설명 상자 */
.hm-tip{position:fixed;z-index:20;left:0;top:0;pointer-events:none;box-sizing:border-box;min-width:192px;max-width:min(280px,calc(100vw - 16px));
  background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);font-size:13px}
.hm-tip h2{margin:0;font-size:14px;font-weight:500;white-space:normal;overflow-wrap:anywhere}
.hm-tip p{margin:0 0 8px;color:var(--muted);font-size:12px}
.hm-tip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.hm-tip dt{color:var(--fg2)}
.hm-tip dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.hm-tip .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}

@media (min-width:861px){
  .hm-app{padding-block:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .hm-foot .hm-legend{order:2}
}
@media (max-width:860px){
  .hm-bar{grid-template-columns:1fr auto}
  .hm-nav{grid-column:1 / -1;grid-row:2;justify-content:space-between}
  .hm-step{width:40px;height:40px}
  .hm-tabs{flex:1;border-radius:10px}
  .hm-tabs button{flex:1;height:32px;padding:0 4px;border-radius:6px}
}
@media (max-width:640px){
  .hm-qsep{display:none}
}
@media (max-width:420px){
  .hm-evt-title{display:none}
  .hm-table .col-sector{display:none}
  .hm-table td,.hm-table th button{padding:8px}
  .hm-table td:first-child{white-space:normal}
  .hm-table td small{display:block;margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  :where(.hm-app) button{transition:none}
}
</style>

</head>
<body>
<div class="hm-app" id="hm-app">
  <header class="hm-bar">
    <h1>한미 4대 지수 히트맵</h1>
    <nav class="hm-nav" aria-label="지수 선택">
      <button type="button" class="hm-step" id="hm-prev" aria-label="이전 지수"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="hm-tabs" id="hm-tabs" role="tablist"></div>
      <button type="button" class="hm-step" id="hm-next" aria-label="다음 지수"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </nav>
    <div class="hm-tools">
      <button type="button" class="hm-tool" id="hm-auto" aria-pressed="false" title="10초마다 다음 지수로 넘어갑니다">자동 넘김</button>
      <div class="hm-seg" role="group" aria-label="보기 방식">
        <button type="button" id="hm-view-map" aria-pressed="true">지도</button>
        <button type="button" id="hm-view-table" aria-pressed="false">표</button>
      </div>
    </div>
  </header>

  <p class="hm-note" id="hm-note" hidden><span id="hm-note-text">Claude 앱 브라우저로 새 시세를 받을 수 있는지 확인하는 중입니다.</span>
    <button type="button" class="hm-tool" id="hm-note-btn" hidden>허용하고 갱신</button>
    <span id="hm-note-link">어디서나 5분마다 갱신되는 화면은
    <a href="https://ose-hallym.github.io/index-heatmap/" target="_blank" rel="noopener">ose-hallym.github.io/index-heatmap</a> 입니다.</span></p>

  <section class="hm-sum">
    <div class="hm-head" id="hm-head"></div>
    <div class="hm-meta">
      <div class="hm-breadth" id="hm-breadth"></div>
      <div class="hm-asof" id="hm-asof"></div>
    </div>
  </section>

  <section class="hm-events" id="hm-events" aria-label="주요 일정" hidden></section>

  <main class="hm-stage" id="hm-stage">
    <div class="hm-map" id="hm-map" role="img"></div>
    <div class="hm-tablewrap" id="hm-tablewrap" hidden>
      <table class="hm-table">
        <thead><tr id="hm-thead"></tr></thead>
        <tbody id="hm-tbody"></tbody>
      </table>
    </div>
    <div class="hm-msg" id="hm-msg" hidden></div>
  </main>

  <footer class="hm-foot">
    <div class="hm-legend" id="hm-legend" aria-label="색 눈금: 등락률 -3%에서 +3%"></div>
    <span id="hm-foot"></span>
  </footer>
</div>
<div class="hm-tip" id="hm-tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3-hierarchy@3.1.2/dist/d3-hierarchy.min.js"></script>
<script>window.HEATMAP_DATA = /*__DATA__*/null;</script>
<script>
(function () {
  'use strict';
  var RANGE = 3;                 // 색 눈금의 끝값(%): 이 이상 오르내리면 가장 진한 색
  var AUTO_MS = 10000;           // 자동 넘김 간격
  var HEAD = 20;                 // 섹터 이름표 높이
  var POLL_MS = 60000;           // 새 시세 파일 확인 간격
  var STALE_MS = 15 * 60000;     // 장중인데 이만큼 갱신이 없으면 경고
  var PAGE_VER = '10555ade77'; // 수집기가 이 화면의 판 번호로 바꿔 넣는다
  var $ = function (id) { return document.getElementById(id); };
  var hasLayout = typeof d3 !== 'undefined' && d3.treemap;
  var DATA = null, INDICES = [];
  var state = { i: 0, view: hasLayout ? 'map' : 'table', timer: null, sort: { key: 'cap', dir: -1 }, pinned: false, fetchOk: true };
  function cur() { return INDICES[state.i]; }

  // ── 데이터 정리 ──
  function prepare(raw) {
    return raw.indices.map(function (ix) {
      var stocks = ix.stocks.map(function (s, i) {
        return { i: i, code: s[0], name: s[1], sector: s[2], cap: s[3], price: s[4], chg: s[5], sub: s[6] || '' };
      });
      var total = 0, up = 0, down = 0, flat = 0, wsum = 0, bySector = {}, order = [];
      stocks.forEach(function (s) {
        total += s.cap; wsum += s.cap * s.chg;
        if (s.chg > 0) up++; else if (s.chg < 0) down++; else flat++;
        if (!bySector[s.sector]) { bySector[s.sector] = { name: s.sector, cap: 0, w: 0, children: [] }; order.push(bySector[s.sector]); }
        var g = bySector[s.sector]; g.cap += s.cap; g.w += s.cap * s.chg; g.children.push(s);
      });
      order.forEach(function (g) { g.chg = g.cap ? g.w / g.cap : 0; });
      return { id: ix.id, name: ix.name, cur: ix.cur, asOf: ix.asOf, index: ix.index, note: ix.note, missing: ix.missing || [],
               status: ix.status || 'closed', events: ix.events || [],
               stocks: stocks, sectors: order, total: total, wavg: total ? wsum / total : 0, up: up, down: down, flat: flat };
    });
  }

  // ── 표기 ──
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtPct(v) { return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + '%'; }
  function fmtNum(v, d) { return Number(v).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function fmtPrice(ix, p) { return p == null ? '-' : ix.cur === 'KRW' ? fmtNum(p, 0) + '원' : '$' + fmtNum(p, 2); }
  function fmtCap(ix, c) {
    if (ix.cur === 'KRW') return c >= 10000 ? fmtNum(c / 10000, c >= 1000000 ? 0 : 1) + '조원' : fmtNum(c, 0) + '억원';   // c: 억원
    return c >= 1000000 ? fmtNum(c / 1000000, 2) + '조 달러' : fmtNum(Math.round(c / 100), 0) + '억 달러';               // c: 백만 달러
  }
  function arrow(v) {
    if (!v) return '';
    return '<span class="hm-arw" style="color:var(--' + (v > 0 ? 'up' : 'down') + ')">' + (v > 0 ? '▲' : '▼') + '</span>';
  }
  function todayIn(tz) {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) {
      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }
  }

  // ── 색: 하락색 – 회색(보합) – 상승색, OKLab 공간에서 섞는다 ──
  var pal = null;
  function hexToRgb(h) {
    h = h.trim().replace('#', '');
    if (h.length === 3) h = h.replace(/./g, '$&$&');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function gam(c) { c = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.round(Math.min(1, Math.max(0, c)) * 255); }
  function toLab(rgb) {
    var r = lin(rgb[0]), g = lin(rgb[1]), b = lin(rgb[2]);
    var l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b),
        m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b),
        s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
            1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
            0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
  }
  function fromLab(lab) {
    var l = Math.pow(lab[0] + 0.3963377774 * lab[1] + 0.2158037573 * lab[2], 3),
        m = Math.pow(lab[0] - 0.1055613458 * lab[1] - 0.0638541728 * lab[2], 3),
        s = Math.pow(lab[0] - 0.0894841775 * lab[1] - 1.2914855480 * lab[2], 3);
    return [gam(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
            gam(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
            gam(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)];
  }
  function lum(rgb) { return 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]); }
  function readPalette() {
    var cs = getComputedStyle($('hm-app'));
    function tok(n) { return hexToRgb(cs.getPropertyValue(n)); }
    var ink = tok('--tile-ink');
    pal = { up: toLab(tok('--up')), down: toLab(tok('--down')), mid: toLab(tok('--mid')), ink: ink, inkLum: lum(ink) };
  }
  function colorFor(chg) {
    var t = Math.max(-1, Math.min(1, chg / RANGE)), k = Math.abs(t), pole = t >= 0 ? pal.up : pal.down;
    var rgb = fromLab([pal.mid[0] + (pole[0] - pal.mid[0]) * k, pal.mid[1] + (pole[1] - pal.mid[1]) * k, pal.mid[2] + (pole[2] - pal.mid[2]) * k]);
    var y = lum(rgb), onWhite = 1.05 / (y + 0.05), onInk = (y + 0.05) / (pal.inkLum + 0.05);
    return { bg: 'rgb(' + rgb.join(',') + ')', fg: onWhite >= onInk ? '#fff' : 'rgb(' + pal.ink.join(',') + ')' };
  }

  // ── 요약 줄 ──
  // 화면마다 보여 줄 지수(main)와 함께 볼 참고 지표(side)
  var QUOTES = {
    kospi200: { main: ['kospi'], side: ['nqf'] },
    kosdaq150: { main: ['kosdaq'], side: ['nqf'] },
    sp500: { main: ['sp500'], side: ['sox', 'k200night'] },
    ndx100: { main: ['ndx100'], side: ['sox', 'k200night'] }
  };
  function quoteHTML(q, big, showTime) {
    return '<span class="hm-q' + (big ? ' big' : '') + '"' + (q.at ? ' title="기준 ' + esc(q.at) + '"' : '') + '><span class="hm-qn">' + esc(q.name) +
      '</span><span class="hm-qv">' + fmtNum(q.close, 2) + '</span><span class="hm-qd">' + arrow(q.chg) +
      (q.diff != null ? fmtNum(Math.abs(q.diff), 2) + ' ' : '') + '(' + fmtPct(q.chg) + ')</span>' +
      (showTime && (q.live || q.at) ? '<span class="hm-qt">' + (q.live ? '거래 중' : esc(q.at)) + '</span>' : '') + '</span>';
  }
  function headHTML(ix) {
    var refs = DATA.refs || {}, plan = QUOTES[ix.id] || { main: [], side: [] }, h = '';
    plan.main.forEach(function (k, n) { if (refs[k]) h += quoteHTML(refs[k], n === 0 && !h, false); });
    if (!h && ix.index && ix.index.close != null && ix.index.chg != null) {

    }
    if (!h) {       // 지수 값을 못 받았을 때만 구성종목 평균으로 대신한다
      h = '<span class="hm-q big"><span class="hm-qn">' + esc(ix.name) + ' 구성종목 시총가중</span><span class="hm-qd">' + arrow(ix.wavg) + fmtPct(ix.wavg) + '</span></span>';
    }
    var side = plan.side.filter(function (k) { return refs[k]; });
    if (side.length) h += '<span class="hm-qsep" aria-hidden="true"></span>' + side.map(function (k) { return quoteHTML(refs[k], false, true); }).join('');
    return h;
  }
  function renderSummary() {
    var ix = cur();
    $('hm-head').innerHTML = headHTML(ix);
    $('hm-breadth').innerHTML =
      '<span class="hm-bbar" aria-hidden="true">' +
      (ix.up ? '<i style="flex:' + ix.up + ';background:var(--up)"></i>' : '') +
      (ix.flat ? '<i style="flex:' + ix.flat + ';background:var(--muted)"></i>' : '') +
      (ix.down ? '<i style="flex:' + ix.down + ';background:var(--down)"></i>' : '') +
      '</span><span>상승 ' + ix.up + ' · 보합 ' + ix.flat + ' · 하락 ' + ix.down + '</span>';
    var live = ix.status === 'open';
    var late = live && DATA.builtTs && Date.now() - DATA.builtTs * 1000 > STALE_MS;
    $('hm-asof').innerHTML = '<span class="hm-dot' + (late || !state.fetchOk ? ' late' : live ? ' live' : '') + '" aria-hidden="true"></span><span>' +
      esc(ix.asOf) + ' · ' + ix.stocks.length + '종목</span>' +
      (late ? '<span class="hm-warn">갱신 지연</span>' : !state.fetchOk ? '<span class="hm-warn">새 시세 확인 실패</span>' : '');
    $('hm-foot').textContent = '크기는 시가총액 · 색은 전일 대비 등락률(' + (ix.cur === 'USD' ? '초록 상승, 빨강 하락' : '빨강 상승, 파랑 하락') + ') · ' + ix.note +
      (ix.missing.length ? ' · 시세 누락으로 제외: ' + ix.missing.join(', ') : '') + ' · 마지막 갱신 ' + DATA.built + ' (한국시간)';
    $('hm-map').setAttribute('aria-label', ix.name + ' 히트맵. 상승 ' + ix.up + ', 보합 ' + ix.flat + ', 하락 ' + ix.down + '종목. 종목별 값은 표 보기에서 읽을 수 있습니다.');
  }
  function renderLegend() {
    var sw = '';
    for (var v = -RANGE; v <= RANGE; v++) sw += '<i style="background:' + colorFor(v).bg + '"></i>';
    $('hm-legend').innerHTML = '<span>하락 −' + RANGE + '%</span><span class="sw" aria-hidden="true">' + sw + '</span><span>+' + RANGE + '% 상승</span>';
  }

  // ── 일정 줄: 지난 일정은 보는 시점에 걸러 낸다(미국 지수는 현지 날짜) ──
  function renderEvents() {
    var ix = cur(), us = ix.cur === 'USD', today = todayIn(us ? 'America/New_York' : 'Asia/Seoul');
    var list = ix.events.filter(function (e) { return e.d >= today; }).slice(0, 8), el = $('hm-events');
    el.hidden = !list.length;
    if (!list.length) return;
    var t0 = Date.parse(today + 'T00:00:00Z');
    el.innerHTML = '<span class="hm-evt-title">주요 일정' + (us ? '(현지 날짜)' : '') + '</span><div class="hm-evt-list">' + list.map(function (e) {
      var d = new Date(e.d + 'T00:00:00Z'), n = Math.round((d - t0) / 86400000);
      var md = (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '(' + '일월화수목금토'.charAt(d.getUTCDay()) + ')';
      return '<span class="hm-ev' + (n <= 1 ? ' soon' : '') + '"><b>' + (n === 0 ? '오늘' : 'D-' + n) + '</b><time datetime="' + esc(e.d) + '">' + md + '</time>' + esc(e.t) + '</span>';
    }).join('') + '</div>';
  }

  // ── 트리맵 ──
  // 글자 폭 어림값(em): 한글 1, W·M 은 넓은 글자, 나머지 영문·숫자·기호
  function units(s) {
    var u = 0;
    for (var k = 0; k < s.length; k++) { var ch = s.charAt(k); u += s.charCodeAt(k) > 0x2e7f ? 1 : (ch === 'W' || ch === 'M') ? 0.94 : 0.64; }
    return u;
  }
  function tileHTML(n, ix) {
    var d = n.data, w = Math.max(1, n.x1 - n.x0 - 2), h = Math.max(1, n.y1 - n.y0 - 2), c = colorFor(d.chg), inner = '';
    var label = ix.cur === 'KRW' ? d.name : d.code;
    if (h >= 12 && w >= 22) {
      var fs = Math.min(28, Math.max(9, h * 0.36), (w - 6) / units(label));
      if (fs < 9 && ix.cur === 'KRW') {              // 긴 한글 이름은 들어가는 만큼만 잘라 보여 준다(두 글자는 구분이 안 돼 생략)
        var keep = Math.floor((w - 4) / 9);
        if (keep >= 3) { label = label.slice(0, keep); fs = 9; }
      }
      if (fs >= 9) {
        var pct = fmtPct(d.chg), ps = Math.max(9, Math.min(18, fs * 0.78));
        var both = h >= fs * 1.2 + ps * 1.2 + 4 && w - 4 >= units(pct) * ps;
        inner = '<b style="font-size:' + fs.toFixed(1) + 'px">' + esc(label) + '</b>' + (both ? '<span style="font-size:' + ps.toFixed(1) + 'px">' + pct + '</span>' : '');
      }
    }
    return '<div class="hm-t" data-i="' + d.i + '" style="left:' + (n.x0 + 1) + 'px;top:' + (n.y0 + 1) + 'px;width:' + w + 'px;height:' + h + 'px;background:' + c.bg + ';color:' + c.fg + '">' + inner + '</div>';
  }
  function renderMap() {
    var el = $('hm-map'), W = el.clientWidth, H = el.clientHeight, ix = cur();
    if (!hasLayout || !ix || W < 60 || H < 60) return;
    var root = d3.hierarchy({ children: ix.sectors })
      .sum(function (d) { return d.children ? 0 : d.cap; })
      .sort(function (a, b) { return b.value - a.value; });
    d3.treemap().size([W, H]).round(true)
      .paddingInner(function (n) { return n.depth === 0 ? 4 : 0; })
      .paddingTop(function (n) { n.head = n.depth === 1 && n.x1 - n.x0 >= 64 && n.y1 - n.y0 >= 46; return n.head ? HEAD : 0; })(root);
    var html = '';
    (root.children || []).forEach(function (g) {
      if (g.head) {
        html += '<div class="hm-sec" style="left:' + (g.x0 + 2) + 'px;top:' + g.y0 + 'px;width:' + (g.x1 - g.x0 - 4) + 'px">' + esc(g.data.name) + '<span>' + fmtPct(g.data.chg) + '</span></div>';
      }
      g.children.forEach(function (n) { html += tileHTML(n, ix); });
    });
    el.innerHTML = html;
  }

  // ── 표 ──
  var COLS = [
    { key: 'name', label: '종목', num: false },
    { key: 'sector', label: '섹터', num: false, cls: 'col-sector' },
    { key: 'price', label: '현재가', num: true },
    { key: 'chg', label: '등락률', num: true },
    { key: 'cap', label: '시가총액', num: true }
  ];
  function renderTable() {
    var ix = cur(), s = state.sort;
    $('hm-thead').innerHTML = COLS.map(function (c) {
      var on = s.key === c.key;
      return '<th class="' + (c.num ? 'num ' : '') + (c.cls || '') + '"' + (on ? ' aria-sort="' + (s.dir > 0 ? 'ascending' : 'descending') + '"' : '') +
        '><button type="button" data-key="' + c.key + '">' + c.label + (on ? (s.dir > 0 ? ' ↑' : ' ↓') : '') + '</button></th>';
    }).join('');
    var rows = ix.stocks.slice().sort(function (a, b) {
      var x = a[s.key], y = b[s.key];
      return (typeof x === 'string' ? x.localeCompare(y, 'ko') : x - y) * s.dir;
    });
    $('hm-tbody').innerHTML = rows.map(function (d) {
      return '<tr><td>' + esc(d.name) + '<small>' + esc(d.code) + '</small></td><td class="col-sector">' + esc(d.sector) + '</td><td class="num">' + fmtPrice(ix, d.price) +
        '</td><td class="num"><span class="dot" style="background:' + colorFor(d.chg).bg + '"></span>' + fmtPct(d.chg) + '</td><td class="num">' + fmtCap(ix, d.cap) + '</td></tr>';
    }).join('');
  }

  // ── 설명 상자 ──
  var tip = $('hm-tip'), onTile = null;
  function showTip(tile, x, y) {
    var ix = cur(), d = ix.stocks[+tile.getAttribute('data-i')];
    if (!d) return;
    if (onTile !== tile) {
      if (onTile) onTile.classList.remove('on');
      onTile = tile; tile.classList.add('on');
      tip.innerHTML = '<h2>' + esc(d.name) + '</h2><p>' + esc(d.code) + ' · ' + esc(d.sector) + (d.sub && d.sub !== d.sector ? ' · ' + esc(d.sub) : '') + '</p><dl>' +
        '<dt>등락률</dt><dd><span class="dot" style="background:' + colorFor(d.chg).bg + '"></span>' + fmtPct(d.chg) + '</dd>' +
        '<dt>현재가</dt><dd>' + fmtPrice(ix, d.price) + '</dd>' +
        '<dt>시가총액</dt><dd>' + fmtCap(ix, d.cap) + '</dd>' +
        '<dt>시총 비중</dt><dd>' + (d.cap / ix.total * 100).toFixed(2) + '%</dd></dl>';
      tip.hidden = false;
    }
    var w = tip.offsetWidth, h = tip.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    var left = x + 14, top = y + 14;
    if (left + w > vw - 8) left = x - w - 14;
    if (top + h > vh - 8) top = y - h - 14;
    tip.style.transform = 'translate(' + Math.max(8, Math.min(left, vw - w - 8)) + 'px,' + Math.max(8, Math.min(top, vh - h - 8)) + 'px)';
  }
  function hideTip() {
    if (onTile) onTile.classList.remove('on');
    onTile = null; state.pinned = false; tip.hidden = true;
  }

  // ── 화면 전환 ──
  function renderStage() {
    hideTip();
    var map = state.view === 'map';
    $('hm-map').hidden = !map;
    $('hm-tablewrap').hidden = map;
    $('hm-view-map').setAttribute('aria-pressed', String(map));
    $('hm-view-table').setAttribute('aria-pressed', String(!map));
    if (map) renderMap(); else renderTable();
  }
  function select(i, quiet) {
    var n = INDICES.length;
    if (!n) return;
    state.i = ((i % n) + n) % n;
    $('hm-app').setAttribute('data-scheme', cur().cur === 'USD' ? 'us' : 'kr');
    readPalette();
    renderLegend();
    Array.prototype.forEach.call($('hm-tabs').children, function (b, k) {
      b.setAttribute('aria-selected', String(k === state.i));
      b.tabIndex = k === state.i ? 0 : -1;
    });
    renderSummary();
    renderEvents();
    renderStage();
    if (!quiet) {
      try { if (location.hash !== '#' + cur().id) location.hash = cur().id; } catch (e) {}
      if (state.timer) startAuto();     // 직접 넘기면 다음 자동 넘김까지 다시 10초
    }
  }
  function startAuto() {
    clearInterval(state.timer);
    state.timer = setInterval(function () { if (!document.hidden && !state.pinned) select(state.i + 1, true); }, AUTO_MS);
    $('hm-auto').setAttribute('aria-pressed', 'true');
  }
  function stopAuto() {
    clearInterval(state.timer); state.timer = null;
    $('hm-auto').setAttribute('aria-pressed', 'false');
  }
  function fromHash() {
    var id = (location.hash || '').slice(1);
    for (var k = 0; k < INDICES.length; k++) if (INDICES[k].id === id) return k;
    return -1;
  }

  // ── 데이터 받기: 넣어 둔 데이터가 있으면 그것을, 없으면 옆의 data.json 을 주기적으로 읽는다 ──
  function showMsg(text) { $('hm-msg').textContent = text; $('hm-msg').hidden = false; }
  function apply(raw) {
    var first = !INDICES.length, keep = first ? null : cur().id, k = -1;
    DATA = raw;
    INDICES = prepare(raw);
    $('hm-msg').hidden = true;
    $('hm-tabs').innerHTML = INDICES.map(function (ix) {
      return '<button type="button" role="tab" id="hm-tab-' + esc(ix.id) + '">' + esc(ix.name) + '</button>';
    }).join('');
    if (first) k = fromHash();
    else for (var j = 0; j < INDICES.length; j++) if (INDICES[j].id === keep) k = j;
    select(k >= 0 ? k : 0, true);
  }
  function poll() {
    fetch('data.json?t=' + Math.floor(Date.now() / 30000), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (raw) {
        state.fetchOk = true;
        if (!raw || !raw.indices || !raw.indices.length) throw new Error('empty');
        // 화면 자체가 바뀌었으면 새 화면을 받아 온다(주소에 판 번호를 붙여 묵은 사본을 피하고, 같은 판으로는 다시 받지 않는다)
        if (raw.page && raw.page !== PAGE_VER && location.search.indexOf('r=' + raw.page) < 0) {
          location.replace(location.pathname + '?r=' + encodeURIComponent(raw.page) + location.hash);
          return;
        }
        if (!DATA || raw.built !== DATA.built) apply(raw); else renderSummary();
      })
      .catch(function () {
        state.fetchOk = false;
        if (DATA) renderSummary(); else showMsg('시세 파일을 불러오지 못했습니다. 잠시 뒤 자동으로 다시 시도합니다.');
      });
  }

  // ── Claude 페이지 전용: PC용 Claude 앱의 브라우저에 시세 원본 페이지를 열어 두고 그 글자를 1분마다 읽어 온다 ──
  // 앱 밖(휴대폰, 웹)에서는 이 길이 없으므로 넣어 둔 시세 그대로 보여 준다.
  function bridge() {
    var SERVER = 'host:claude_browser';
    var FEED = 'https://ose-hallym.github.io/index-heatmap/feed.html';
    var REOPEN_MS = 5 * 60000;     // 원본 탭을 다시 열거나 새로 고치는 최소 간격
    var FEED_STALE = 200;          // 원본 페이지가 이만큼(초) 스스로 갱신하지 못했으면 새로 고친다
    var DENIED = { approval_required: 1, not_in_manifest: 1, not_granted: 1, consent_required: 1, blocked_by_policy: 1, cancelled: 1 };
    var GONE = { server_not_connected: 1, capability_disabled: 1, capability_removed: 1, server_not_found: 1 };
    var mcp = null, tab = null, busy = false, stopped = false, lastOpen = 0, lastNav = 0, diag = '', opened = '', stage = '';

    function note(text, button, link) {
      $('hm-note-text').textContent = text;
      $('hm-note-btn').hidden = !button;
      $('hm-note-link').hidden = !link;
    }
    function hhmm() {
      return new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
    }
    function textOf(res) {
      var out = [];
      if (res && res.content) res.content.forEach(function (b) { if (b && typeof b.text === 'string') out.push(b.text); });
      if (out.length) return out.join('\n');   // payload 는 같은 글자의 사본이라 겹쳐 붙이지 않는다
      if (res && typeof res.payload === 'string') out.push(res.payload);
      else if (res && res.payload) { try { out.push(JSON.stringify(res.payload)); } catch (e) {} }
      return out.join('\n');
    }
    function wait(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }
    function brief(s) { return String(s || '').replace(/\s+/g, ' ').slice(0, 140); }
    function setTab(id) { tab = id || null; }
    // 탭 번호는 응답 글자 속에 여러 모양으로 올 수 있다(따옴표가 한 번 더 싸여 있거나, 읽기 응답의 꼬리말에만 있거나)
    function tabIn(text) {
      var m = /\\*"tabId\\*"\s*:\s*\\*"?([A-Za-z0-9_-]+)/.exec(text) || /Executed on tabId:\s*([A-Za-z0-9_-]+)/.exec(text) ||
        /\(tabId\s+([A-Za-z0-9_-]+)\)/.exec(text);   // 실제 앱의 열기 응답: "Opened the site in Claude's browser (tabId seed)."
      return m ? m[1] : null;
    }
    // 원본 탭에 깃허브 오류 화면 같은 다른 내용이 떠 있으면 스스로 돌아오지 못하므로 다시 불러 준다
    function reload() {
      lastNav = Date.now(); stage = '새로 고침';
      return mcp.callTool(SERVER, 'navigate', { url: FEED + '?t=' + Math.floor(Date.now() / 60000), tabId: tab })
        .then(function () { return wait(3000); });
    }
    function openTab() {
      lastOpen = Date.now(); stage = '열기';
      return mcp.callTool(SERVER, 'preview_start', { url: FEED }).then(function (res) {
        var text = textOf(res);
        opened = '열기 응답: ' + brief(text);
        setTab(tabIn(text));       // 번호를 못 찾으면 앞에 나온 탭을 읽는다
        return wait(3000);
      });
    }
    function readFeed() {
      var input = { max_chars: 600000 };
      if (tab) input.tabId = tab;
      stage = '읽기';
      return mcp.callTool(SERVER, 'get_page_text', input, { cache: false }).then(function (res) {
        var text = textOf(res), m = /@@HM(\d+)@@([\s\S]*?)@@END@@/.exec(text);   // 같은 글자가 두 번 와도 첫 묶음만 쓴다
        if (!m) { diag = '읽기 응답: ' + brief(text); return null; }
        if (!tab) setTab(tabIn(text.slice(0, m.index) + text.slice(m.index + m[0].length)));
        try { return { at: +m[1], raw: JSON.parse(m[2]) }; } catch (e) { diag = '읽기 응답을 풀지 못함(길이 ' + m[2].length + ', 끝 ' + brief(m[2].slice(-50)) + ')'; return null; }
      });
    }
    // 원본 탭이 없거나 닫혔으면 연다. 방금 열었으면 내용이 뜰 때까지 한 번 더 읽는다.
    function fetchFeed() {
      // 화면을 열면 먼저 원본 주소부터 연다. 탭이 다른 주소에 가 있을 때 그 내용을 읽으려 들면 앱이 따로 허락을 묻기 때문이다.
      if (!lastOpen) return openTab().then(readFeed).then(function (g) { return g || wait(4000).then(readFeed); });
      var failed = false;
      return readFeed().catch(function (e) {
        var c = e && e.code;
        if (GONE[c] || (DENIED[c] && c !== 'cancelled')) throw e;
        failed = true; diag = '읽기 실패: ' + brief(c + ' ' + ((e && e.message) || '')); return null;
      }).then(function (got) {
        if (got) return got;
        if (Date.now() - lastNav < 50000) return null;
        lastNav = Date.now();
        // 읽기가 막혔으면(탭이 닫혔거나 다른 주소로 바뀜) 원본을 다시 열고, 읽혔는데 시세가 아니면(오류 화면) 다시 불러온다.
        // 다시 연 뒤에도 취소되면 사용자가 거절한 것이므로 멈추고 버튼을 보여 준다.
        return (failed || !tab ? openTab() : reload()).then(readFeed);
      });
    }
    function tick() {
      if (busy || stopped || document.hidden) return;
      busy = true;
      fetchFeed().then(function (got) {
        if (!got || !got.raw || !got.raw.indices || !got.raw.indices.length) throw { code: 'no_feed' };
        if (tab && Date.now() / 1000 - got.at > FEED_STALE && Date.now() - lastNav > REOPEN_MS) {
          lastNav = Date.now();   // 가려진 탭이 멈춰 있으면 한 번 새로 고쳐 둔다(다음 확인 때 읽힌다)
          mcp.callTool(SERVER, 'navigate', { url: FEED, tabId: tab }).catch(function () {});
        }
        state.fetchOk = true;
        if (got.raw.built !== DATA.built) apply(got.raw); else renderSummary();
        note('Claude 앱 브라우저로 자동 갱신 중입니다. 마지막 확인 ' + hhmm(), false, false);
      }).catch(function (e) {
        var code = (e && e.code) || 'unknown';
        if (DENIED[code]) {
          stopped = true;
          note('자동 갱신에는 Claude 앱 브라우저 사용 허용이 필요합니다. 버튼을 누른 뒤 뜨는 창에서 허용해 주세요. [' + stage + ' ' + code + ']', true, true);
        } else if (GONE[code]) {
          stopped = true;
          note('이 화면은 PC용 Claude 앱에서 열 때만 자동으로 갱신됩니다.', false, true);
        } else {
          state.fetchOk = false; renderSummary();
          if (code !== 'no_feed') diag = brief(code + ' ' + ((e && e.message) || ''));
          note('새 시세를 가져오지 못했습니다. 1분 뒤 다시 확인합니다. [' + diag + (opened ? ' / ' + opened : '') + ']', false, true);
        }
      }).then(function () { busy = false; });
    }
    $('hm-note-btn').addEventListener('click', function () {
      stopped = false; setTab(null); lastOpen = 0;
      note('Claude 앱 브라우저에 요청하는 중입니다.', false, false);
      tick();
    });
    if (!window.claude || typeof window.claude.use !== 'function') {
      note('이 화면은 고정 사본이라 자동으로 갱신되지 않습니다.', false, true);
      return;
    }
    window.claude.use('mcp').then(function (ns) {
      if (!ns) { note('이 화면은 PC용 Claude 앱에서 열 때만 자동으로 갱신됩니다.', false, true); return; }
      mcp = ns;
      note('Claude 앱 브라우저로 새 시세를 가져오는 중입니다.', false, false);
      tick();
      setInterval(tick, POLL_MS);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
    }, function () { note('이 화면은 고정 사본이라 자동으로 갱신되지 않습니다.', false, true); });
  }

  // ── 연결 ──
  $('hm-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    select(Array.prototype.indexOf.call($('hm-tabs').children, b));
  });
  $('hm-prev').addEventListener('click', function () { select(state.i - 1); });
  $('hm-next').addEventListener('click', function () { select(state.i + 1); });
  $('hm-auto').addEventListener('click', function () { if (state.timer) stopAuto(); else startAuto(); });
  $('hm-view-map').addEventListener('click', function () {
    if (!hasLayout || !INDICES.length) return;
    state.view = 'map'; renderStage();
  });
  $('hm-view-table').addEventListener('click', function () { if (!INDICES.length) return; state.view = 'table'; renderStage(); });
  $('hm-thead').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var key = b.getAttribute('data-key');
    state.sort = { key: key, dir: state.sort.key === key ? -state.sort.dir : (key === 'name' || key === 'sector' ? 1 : -1) };
    renderTable();
  });
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || !INDICES.length) return;
    if (e.key === 'ArrowLeft') { select(state.i - 1); $('hm-tabs').children[state.i].focus(); }
    else if (e.key === 'ArrowRight') { select(state.i + 1); $('hm-tabs').children[state.i].focus(); }
    else if (e.key === 'Escape') hideTip();
  });

  var map = $('hm-map'), touchStart = null;
  map.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    var t = e.target.closest('.hm-t');
    if (t) showTip(t, e.clientX, e.clientY); else hideTip();
  });
  map.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') hideTip(); });
  map.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse') touchStart = { x: e.clientX, y: e.clientY }; });
  map.addEventListener('pointerup', function (e) {
    if (e.pointerType === 'mouse' || !touchStart) return;
    var dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y; touchStart = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50) { select(state.i + (dx < 0 ? 1 : -1)); return; }   // 좌우로 밀어 넘기기
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) return;
    var t = e.target.closest('.hm-t');                                                           // 눌러서 값 보기
    if (t && t !== onTile) { showTip(t, e.clientX, e.clientY); state.pinned = true; } else hideTip();
  });
  map.addEventListener('pointercancel', function () { touchStart = null; });
  document.addEventListener('pointerdown', function (e) { if (state.pinned && !e.target.closest('.hm-map')) hideTip(); });

  var raf = 0;
  function rerender() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () { if (!INDICES.length) return; hideTip(); if (state.view === 'map') renderMap(); });
  }
  if (window.ResizeObserver) new ResizeObserver(rerender).observe($('hm-stage')); else window.addEventListener('resize', rerender);

  function retheme() {
    if (!INDICES.length) return;
    readPalette(); renderLegend();
    if (state.view === 'map') renderMap(); else renderTable();
  }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', retheme); else if (mq.addListener) mq.addListener(retheme);
  }
  if (window.MutationObserver) new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.addEventListener('hashchange', function () { var k = fromHash(); if (k >= 0 && k !== state.i) select(k); });

  if (!hasLayout) {
    $('hm-view-map').disabled = true;
    $('hm-view-map').title = '지도를 그리는 구성 요소를 불러오지 못해 표로 보여 드립니다';
  }
  if (window.HEATMAP_DATA && window.HEATMAP_DATA.indices && window.HEATMAP_DATA.indices.length) {
    $('hm-note').hidden = false;      // 데이터를 넣어 둔 사본(Claude 페이지)은 바깥 주소를 직접 읽지 못한다
    apply(window.HEATMAP_DATA);
    bridge();
  } else {
    showMsg('시세를 불러오는 중입니다.');
    poll();
    setInterval(poll, POLL_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  }
})();
</script>
</body>
</html>
